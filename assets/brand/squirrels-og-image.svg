<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Squirrels — Fast. Curious. Thoughtfully Built.">
  <!-- Background: warm cream -->
  <rect width="1200" height="630" fill="#FDF5EC"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#E8621A"/>

  <!-- Large decorative icon (background, low opacity) -->
  <g transform="translate(760, 40) scale(5.5)" opacity="0.07">
    <rect width="100" height="100" rx="22" fill="#E8621A"/>
    <path d="M 44 70 C 66 70 78 56 78 42 C 78 26 64 14 50 16"
          fill="none" stroke="#2B1506" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="16" r="11" fill="#2B1506"/>
    <ellipse cx="28" cy="64" rx="13" ry="12" fill="#2B1506"/>
    <circle cx="28" cy="42" r="14" fill="#2B1506"/>
    <polygon points="17,34 19,15 28,32" fill="#2B1506"/>
    <polygon points="28,31 37,14 39,33" fill="#2B1506"/>
  </g>

  <!-- Icon: 96×96 -->
  <g transform="translate(80, 210) scale(0.96)">
    <rect width="100" height="100" rx="22" fill="#E8621A"/>
    <path d="M 44 70 C 66 70 78 56 78 42 C 78 26 64 14 50 16"
          fill="none" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="16" r="11" fill="white"/>
    <ellipse cx="28" cy="64" rx="13" ry="12" fill="white"/>
    <circle cx="28" cy="42" r="14" fill="white"/>
    <polygon points="17,34 19,15 28,32" fill="white"/>
    <polygon points="28,31 37,14 39,33" fill="white"/>
    <polygon points="18.5,33 20,20 27,31" fill="#E8621A" opacity="0.38"/>
    <polygon points="28.5,31 36,19 37.5,32" fill="#E8621A" opacity="0.38"/>
    <circle cx="35" cy="39" r="3.5" fill="#E8621A"/>
    <circle cx="36.2" cy="37.8" r="1.2" fill="white"/>
  </g>

  <!-- Wordmark -->
  <text x="180" y="288"
        font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="600"
        font-size="72"
        letter-spacing="-1.5"
        fill="#1A1714">squirrels</text>

  <!-- Divider -->
  <rect x="80" y="316" width="560" height="2" fill="#E8621A" opacity="0.4"/>

  <!-- Tagline -->
  <text x="80" y="370"
        font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="400"
        font-size="28"
        letter-spacing="0.2"
        fill="#2B1506" opacity="0.7">Fast. Curious. Thoughtfully Built.</text>

  <!-- Sub-descriptor -->
  <text x="80" y="416"
        font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="400"
        font-size="22"
        fill="#2B1506" opacity="0.5">A WordPress theme for WooCommerce</text>

  <!-- Domain -->
  <text x="80" y="556"
        font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="500"
        font-size="20"
        fill="#E8621A" opacity="0.85">squirrels.ninja</text>
</svg>
