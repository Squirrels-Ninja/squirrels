<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Squirrels">
  <!-- Simplified for small sizes: dominant tail + body silhouette -->
  <rect width="32" height="32" rx="7" fill="#E8621A"/>

  <!-- Tail stroke -->
  <path d="M 14 23 C 22 23 26 18 26 13 C 26 8 21 5 16 6"
        fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Tail tip -->
  <circle cx="16" cy="6" r="3.5" fill="white"/>

  <!-- Body -->
  <ellipse cx="9" cy="21" rx="4.5" ry="4" fill="white"/>

  <!-- Head -->
  <circle cx="9" cy="13" r="4.5" fill="white"/>

  <!-- Ear left -->
  <polygon points="5,10 6,5 9,10" fill="white"/>
  <!-- Ear right -->
  <polygon points="9,10 12,5 13,10" fill="white"/>
</svg>
